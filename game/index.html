<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Strike — CG2271 Flight Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif;cursor:crosshair}
canvas{display:block}

#hud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}

#score-box{position:absolute;top:20px;right:20px;text-align:right}
#score{color:#fff;font-size:28px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#kills{color:rgba(255,255,255,.6);font-size:14px;margin-top:2px}

#wave-box{position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center}
#wave-label{color:#fbbf24;font-size:22px;font-weight:700;letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#enemies-left{color:rgba(255,255,255,.5);font-size:13px;margin-top:2px}

#health-box{position:absolute;top:20px;left:20px;width:180px}
#health-label{color:rgba(255,255,255,.7);font-size:12px;letter-spacing:1px;margin-bottom:4px}
#health-bar{width:100%;height:10px;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden}
#health-fill{width:100%;height:100%;background:linear-gradient(90deg,#4ade80,#22c55e);border-radius:5px;transition:width .3s}

#speed-box{position:absolute;bottom:20px;left:20px;color:rgba(255,255,255,.7);font-size:14px}
#alt-box{position:absolute;bottom:40px;left:20px;color:rgba(255,255,255,.7);font-size:14px}
#pos-box{position:absolute;bottom:60px;left:20px;color:rgba(255,255,255,.7);font-size:14px}

#minimap{position:absolute;bottom:20px;right:20px;width:150px;height:150px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.4);backdrop-filter:blur(4px)}

#ceiling-warn{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);color:#ff4444;font-size:32px;font-weight:800;letter-spacing:4px;text-shadow:0 0 20px rgba(255,0,0,.8),0 0 40px rgba(255,0,0,.4);pointer-events:none;z-index:15;opacity:0;transition:opacity .2s}
#ceiling-warn.show{opacity:1;animation:warnFlash .5s infinite}
@keyframes warnFlash{0%,100%{opacity:1}50%{opacity:.3}}

#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;border:2px solid rgba(255,255,255,.4);border-radius:50%}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,.4)}
#crosshair::before{top:50%;left:-8px;width:6px;height:2px}
#crosshair::after{top:-8px;left:50%;width:2px;height:6px;transform:translateX(-50%)}
#dot{position:absolute;top:50%;left:50%;width:3px;height:3px;background:rgba(255,255,255,.7);border-radius:50%;transform:translate(-50%,-50%)}

#killfeed{position:absolute;top:70px;right:20px;text-align:right}
.kill-msg{color:#fbbf24;font-size:14px;font-weight:600;margin-bottom:4px;animation:killfade 2s forwards}
@keyframes killfade{0%{opacity:1;transform:translateX(0)}80%{opacity:1}100%{opacity:0;transform:translateX(20px)}}

#controls-help{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.3);font-size:11px;text-align:center;line-height:1.5}

#damage-flash{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse,transparent 40%,rgba(255,0,0,.3));pointer-events:none;z-index:8;opacity:0;transition:opacity .1s}
#stealth-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,10,40,.45);pointer-events:none;z-index:7;opacity:0;transition:opacity .6s}

#connect-panel{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:8px;backdrop-filter:blur(8px)}
#ws-url{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 10px;border-radius:4px;font-size:12px;width:260px;outline:none}
#ws-url:focus{border-color:rgba(255,255,255,.4)}
#ws-btn{background:#3b82f6;color:#fff;border:none;padding:5px 14px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600}
#ws-btn:hover{background:#2563eb}
#ws-dot{width:8px;height:8px;border-radius:50%;background:#ef4444;margin-left:4px}
#ws-dot.on{background:#4ade80}

#game-over{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;flex-direction:column;z-index:30}
#game-over h1{color:#fff;font-size:52px;margin-bottom:8px;letter-spacing:4px}
#game-over .sub{color:rgba(255,255,255,.6);font-size:18px;margin-bottom:6px}
#game-over .sub2{color:rgba(255,255,255,.4);font-size:15px;margin-bottom:30px}
#restart-btn{background:#ef4444;color:#fff;border:none;padding:14px 36px;font-size:18px;font-weight:700;border-radius:8px;cursor:pointer;letter-spacing:1px}
#restart-btn:hover{background:#dc2626}

#wave-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:15;pointer-events:none;text-align:center;opacity:0;transition:opacity .4s}
#wave-banner h2{color:#fbbf24;font-size:64px;font-weight:800;letter-spacing:6px;text-shadow:0 4px 20px rgba(0,0,0,.5)}
#wave-banner .wsub{color:rgba(255,255,255,.6);font-size:18px;margin-top:4px}

#start-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:25;cursor:pointer}
#start-screen h1{color:#fff;font-size:56px;letter-spacing:6px;margin-bottom:8px}
#start-screen .sub{color:#fbbf24;font-size:16px;margin-bottom:40px;letter-spacing:2px}
#start-screen .hint{color:rgba(255,255,255,.4);font-size:14px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.8}}
</style>
</head>
<body>

<div id="damage-flash"></div>
<div id="ceiling-warn">⚠ TOO HIGH — ICING ⚠</div>
<div id="stealth-overlay"></div>

<div id="wave-banner">
  <h2 id="wave-banner-text">WAVE 1</h2>
  <div class="wsub" id="wave-banner-sub">1 enemy incoming</div>
</div>

<div id="start-screen">
  <h1>SKY STRIKE</h1>
  <div class="sub">DOGFIGHT ARENA</div>
  <div class="hint">Click anywhere to start</div>
</div>

<div id="hud" style="display:none">
  <div id="score-box"><div id="score">0</div><div id="kills">0 KILLS</div></div>
  <div id="wave-box"><div id="wave-label">WAVE 1</div><div id="enemies-left">1 enemy remaining</div></div>
  <div id="health-box">
    <div id="health-label">HULL INTEGRITY</div>
    <div id="health-bar"><div id="health-fill"></div></div>
  </div>
  <div id="pos-box">POS: 0, 0</div>
  <div id="alt-box">ALT: 0</div>
  <div id="speed-box">SPD: 0</div>
  <div id="crosshair"><div id="dot"></div></div>
  <canvas id="minimap" width="150" height="150"></canvas>
  <div id="killfeed"></div>
  <div id="controls-help">WASD Pitch/Roll &nbsp; Q/E Yaw &nbsp; Arrows Camera &nbsp; Shift/Ctrl Throttle &nbsp; Space Fire</div>
</div>

<div id="connect-panel">
  <input id="ws-url" type="text" placeholder="wss://your-relay.glitch.me" spellcheck="false">
  <button id="ws-btn" onclick="toggleWS()" tabindex="-1">Connect</button>
  <div id="ws-dot"></div>
</div>

<div id="game-over">
  <h1>SHOT DOWN</h1>
  <div class="sub">Final Score: <span id="final-score">0</span></div>
  <div class="sub2">Survived to Wave <span id="final-wave">1</span></div>
  <button id="restart-btn" onclick="restartGame()">FLY AGAIN</button>
</div>

<!-- Load order matters: config → world → enemies → game -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="config.js"></script>
<script src="world.js"></script>
<script src="enemies.js"></script>
<script src="game.js"></script>
</body>
</html>
